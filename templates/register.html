{% extends 'base.html' %}

{% block content %}

<div class="card">

    <h2>
        Register
    </h2>
{% if error %}
<p>{{ error }}</p>
{% endif %}
    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="btn">

            Register

        </button>

    </form>

</div>

{% endblock %}
