{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ToDo Manager</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">
            ToDo Manager
        </div>

        <ul class="nav-links">

            <li>
                <a href="{% url 'home' %}">
                    Home
                </a>
            </li>

            {% if user.is_authenticated %}

            <li>
                <a href="{% url 'dashboard' %}">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="{% url 'task_list' %}">
                    Tasks
                </a>
            </li>

            <li>
                <a href="{% url 'profile' %}">
                    Profile
                </a>
            </li>

            <li>
                <a href="{% url 'logout' %}">
                    Logout
                </a>
            </li>

            {% else %}

            <li>
                <a href="{% url 'login' %}">
                    Login
                </a>
            </li>

            <li>
                <a href="{% url 'register' %}">
                    Register
                </a>
            </li>

            {% endif %}

        </ul>

    </nav>

</header>

<main class="container">

    {% block content %}
    {% endblock %}

</main>

<footer>

    <p>
        © 2026 ToDo Manager
    </p>

</footer>

</body>

</html>
